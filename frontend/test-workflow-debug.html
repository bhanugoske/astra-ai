<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .debug-panel {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .log {
            background: #000;
            padding: 10px;
            border-radius: 5px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔧 Astra Workflow Debug Test</h1>
    
    <div class="debug-panel">
        <h3>Test Controls</h3>
        <button onclick="testWorkflowCommand()">Test "initiate workflow" Command</button>
        <button onclick="testDirectCall()">Test Direct Function Call</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="debug-panel">
        <h3>Debug Log</h3>
        <div id="debug-log" class="log"></div>
    </div>
    
    <script>
        // Override console.log to capture all debug messages
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function logToPanel(message, type = 'log') {
            const logPanel = document.getElementById('debug-log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff6b6b' : type === 'warn' ? '#ffd93d' : '#6bcf7f';
            logPanel.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logPanel.scrollTop = logPanel.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logToPanel(args.join(' '), 'log');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            logToPanel(args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            logToPanel(args.join(' '), 'warn');
        };
        
        function testWorkflowCommand() {
            console.log('🧪 Testing workflow command...');
            
            // Simulate voice command processing
            if (window.astraVoiceAgent) {
                console.log('✅ AstraVoiceAgent found');
                window.astraVoiceAgent.processCommand('initiate workflow');
            } else {
                console.error('❌ AstraVoiceAgent not found');
            }
        }
        
        function testDirectCall() {
            console.log('🧪 Testing direct function call...');
            
            if (window.astraApp && typeof window.astraApp.handleWorkflowCommands === 'function') {
                console.log('✅ AstraApp found');
                window.astraApp.handleWorkflowCommands('initiate workflow', 'initiate workflow');
            } else {
                console.error('❌ AstraApp or handleWorkflowCommands not found');
            }
        }
        
        function clearLog() {
            document.getElementById('debug-log').innerHTML = '';
        }
        
        // Check if required objects are available
        window.addEventListener('load', () => {
            console.log('🔍 Checking system availability...');
            console.log('window.astraApp:', !!window.astraApp);
            console.log('window.astraVoiceAgent:', !!window.astraVoiceAgent);
            
            if (window.astraApp) {
                console.log('handleWorkflowCommands:', typeof window.astraApp.handleWorkflowCommands);
                console.log('runCompleteWorkflowAutomation:', typeof window.astraApp.runCompleteWorkflowAutomation);
            }
        });
    </script>
</body>
</html>
